<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Tetris MVP</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="header__row">
      <h1 class="header__title">Tetris</h1>
      <button id="controls-help-btn" class="btn btn--header" type="button" hidden>조작방법</button>
    </div>
    <p class="header__subtitle">블록을 이동하고 줄을 없애 점수를 올려 보세요.</p>
  </header>

  <div id="controls-modal" class="controls-modal" hidden>
    <div class="controls-modal__backdrop" data-close-modal></div>
    <div class="controls-modal__dialog panel-card" role="dialog" aria-labelledby="controls-modal-title">
      <h2 id="controls-modal-title" class="panel-card__title">조작방법</h2>
      <ul class="controls-list">
        <li><kbd>←</kbd> <kbd>→</kbd> 좌우 이동</li>
        <li><kbd>↓</kbd> 빠르게 내리기</li>
        <li><kbd>↑</kbd> 회전</li>
        <li><kbd>Space</kbd> 하드 드롭</li>
        <li><kbd>P</kbd> 일시 정지 / 재개</li>
        <li class="controls-list__touch">모바일: 보드 아래 터치 버튼</li>
      </ul>
      <button id="controls-modal-close" class="btn btn--secondary" type="button">닫기</button>
    </div>
  </div>

  <main class="main-content">
    <section id="auth-gate" class="auth-gate" hidden>
      <div class="auth-gate__inner">
        <div class="panel-card panel-card--auth">
          <div id="auth-login-panel" class="auth-panel">
            <h2 class="panel-card__title">로그인</h2>
            <p id="login-message" class="auth-message" aria-live="polite"></p>
            <form id="login-form" class="auth-form">
              <label class="auth-form__label">
                이메일
                <input id="login-email" class="auth-form__input" type="email" autocomplete="email" required>
              </label>
              <label class="auth-form__label">
                비밀번호
                <input id="login-password" class="auth-form__input" type="password" autocomplete="current-password" minlength="6" required>
              </label>
              <div class="auth-form__actions">
                <button id="login-submit" class="btn btn--secondary" type="submit">로그인</button>
                <button id="show-register-btn" class="btn btn--ghost" type="button">회원가입</button>
              </div>
            </form>
          </div>

          <div id="auth-register-panel" class="auth-panel" hidden>
            <h2 class="panel-card__title">회원가입</h2>
            <p id="register-message" class="auth-message" aria-live="polite"></p>
            <form id="register-form" class="auth-form">
              <label class="auth-form__label">
                이메일
                <input id="register-email" class="auth-form__input" type="email" autocomplete="email" required>
              </label>
              <label class="auth-form__label">
                비밀번호
                <input id="register-password" class="auth-form__input" type="password" autocomplete="new-password" minlength="6" required>
              </label>
              <div class="auth-form__actions">
                <button id="register-submit" class="btn btn--secondary" type="submit">회원가입</button>
                <button id="show-login-btn" class="btn btn--ghost" type="button">로그인</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </section>

    <div id="game-area" class="game" hidden>
      <div class="game-stats">
        <div class="game-stats__item">
          <span class="game-stats__label">점수</span>
          <p id="score" class="game-stats__value game-stats__value--score">0</p>
        </div>
        <div class="game-stats__item">
          <span class="game-stats__label">레벨</span>
          <p id="level" class="game-stats__value">1</p>
        </div>
        <div class="game-stats__item">
          <span class="game-stats__label">시간</span>
          <p id="play-time" class="game-stats__value">0s</p>
        </div>
        <div class="game-stats__item">
          <span class="game-stats__label">상태</span>
          <p id="status" class="game-stats__value game-stats__value--status">대기 중</p>
        </div>
      </div>

      <section class="game__board-wrap">
        <div class="game__board-inner">
          <canvas id="board" class="game__canvas" aria-label="테트리스 게임 보드"></canvas>
          <div id="start-overlay" class="game__overlay">
            <button id="start-btn" class="btn btn--overlay" type="button">Start</button>
          </div>
        </div>
        <div id="touch-controls" class="touch-controls" aria-label="터치 조작">
          <button class="touch-controls__btn" type="button" data-action="left" aria-label="왼쪽">←</button>
          <button class="touch-controls__btn" type="button" data-action="rotate" aria-label="회전">↻</button>
          <button class="touch-controls__btn" type="button" data-action="right" aria-label="오른쪽">→</button>
          <button class="touch-controls__btn touch-controls__btn--wide" type="button" data-action="down" aria-label="아래">↓</button>
          <button class="touch-controls__btn touch-controls__btn--wide" type="button" data-action="hard" aria-label="하드 드롭">DROP</button>
        </div>
      </section>

      <aside class="game__panel">
        <div id="auth-logged-in" class="auth-logged-in" hidden>
          <span id="auth-user-email" class="auth-logged-in__email"></span>
          <button id="logout-btn" class="btn btn--compact" type="button">로그아웃</button>
        </div>

        <div class="panel-card panel-card--high-score">
          <h2 class="panel-card__title">전체 최고 점수</h2>
          <p id="high-score" class="panel-card__score">—</p>
          <p id="high-score-meta" class="panel-card__meta"></p>
        </div>

        <div class="game__panel-actions">
          <button id="pause-btn" class="btn btn--secondary" type="button" disabled>게임 일시정지</button>
          <button id="music-btn" class="btn btn--secondary" type="button" aria-pressed="true">음악 끄기</button>
        </div>
      </aside>
    </div>
  </main>

  <script src="music.js"></script>
  <script src="api.js"></script>
  <script src="game.js"></script>
</body>
</html>
